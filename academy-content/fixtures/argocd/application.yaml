apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: academy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_OWNER/REPLACE_REPOSITORY.git
    targetRevision: main
    path: fixtures/helm/academy
    helm:
      releaseName: gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: academy-gitops
  syncPolicy:
    syncOptions:
      - CreateNamespace=true