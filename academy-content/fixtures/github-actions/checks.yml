name: Academy sample checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test sample service
        run: python -m unittest discover -s fixtures/app -v
      - name: Build training image
        run: docker build -t academy:${{ github.sha }} fixtures/app
      - name: Record source identity
        run: git rev-parse HEAD > source-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-revision
          path: source-revision.txt