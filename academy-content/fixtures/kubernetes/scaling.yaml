apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: academy
  namespace: academy
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: academy}
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: academy
  namespace: academy
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: academy}