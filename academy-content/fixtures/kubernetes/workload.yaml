apiVersion: v1
kind: Namespace
metadata:
  name: academy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: academy-config
  namespace: academy
data:
  APP_MODE: normal
  APP_VERSION: "1"
---
apiVersion: v1
kind: Secret
metadata:
  name: academy-demo
  namespace: academy
type: Opaque
stringData:
  DUMMY_TOKEN: not-a-real-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: academy
  namespace: academy
spec:
  replicas: 1
  selector:
    matchLabels: {app: academy}
  template:
    metadata:
      labels: {app: academy}
    spec:
      containers:
        - name: app
          image: academy:1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef: {name: academy-config}
          env:
            - name: DUMMY_TOKEN
              valueFrom:
                secretKeyRef: {name: academy-demo, key: DUMMY_TOKEN}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: academy
  namespace: academy
spec:
  selector: {app: academy}
  ports:
    - name: http
      port: 80
      targetPort: http